[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latexally"
version = "0.1.0"
description = "Convert LaTeX instructional materials into tagged, ADA Title II / PDF/UA-conforming PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UC Berkeley EECS 16A course staff" }]
keywords = ["latex", "accessibility", "pdf-ua", "wcag", "ada", "tagpdf", "alt-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.10",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

# Deliberately light. Everything heavier is an extra, and every code path that
# needs an extra degrades with an actionable message rather than an ImportError.
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "textual>=0.80",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pikepdf>=8.0"]
tui = ["PyMuPDF>=1.24"]
math = ["latex2mathml>=3.77"]
all = [
    "pikepdf>=8.0",
    "PyMuPDF>=1.24",
    "latex2mathml>=3.77",
]

# Synced by default, so `uv run` gives you a fully capable tool rather than one
# that degrades three ways and tells you to install extras. The extras above
# stay as they are for anyone installing with pip; this group only says which
# of them a developer working in the repo should always have. Self-referencing
# `latexally[all]` rather than restating the pins keeps one list, not two.
[dependency-groups]
dev = [
    "latexally[all]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    # Colour science for the drawing palette: OKLCH, WCAG contrast, dE2000 and
    # the CSS colour names. A test derives those values rather than trusting
    # them, so the library is needed to run the suite, not to run the tool --
    # the palette ships as seven literals in the .sty.
    "coloraide>=4.0",
]

[project.scripts]
latexally = "latexally.cli:main"

[project.urls]
Homepage = "https://github.com/YingK8/EECS16A-Accessibility-Tool"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latexally = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    # Builds real documents with pdflatex: about a minute each, so it is opt-in
    # rather than part of the default run.
    "corpus: compiles documents from the live corpus",
]
# `pytest` stays a thing you can run while you work. `pytest -m corpus`
# overrides this and runs only the slow tier.
addopts = ["-m", "not corpus"]
